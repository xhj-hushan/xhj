<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 花瓣的深色渐变 -->
    <linearGradient id="roseDark" x1="40" y1="20" x2="80" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B32035"/>
      <stop offset="100%" stop-color="#7A0B17"/>
    </linearGradient>
    
    <!-- 花瓣的亮色渐变 -->
    <linearGradient id="roseLight" x1="50" y1="30" x2="70" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E83D4E"/>
      <stop offset="100%" stop-color="#C82235"/>
    </linearGradient>
  </defs>

  <g stroke="#3D080D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- 1. 缩短的花茎 (高度只到 Y=110) -->
    <path d="M 64 75 L 64 110" stroke="#2E5B3A" stroke-width="7" />
    
    <!-- 花茎上的一根小刺 -->
    <path d="M 64 92 L 71 88 L 64 100 Z" fill="#2E5B3A" stroke-width="1.5" />

    <!-- 2. 花萼 (托住花朵的底座) -->
    <path d="M 45 72 L 64 67 L 83 72 L 64 85 Z" fill="#2E5B3A" />

    <!-- 3. 外层花瓣 (整体上移) -->
    <path d="M 64 67 C 40 67 30 42 45 27 C 50 37 60 47 64 67 Z" fill="url(#roseDark)" />
    <path d="M 64 67 C 88 67 98 42 83 27 C 78 37 68 47 64 67 Z" fill="url(#roseDark)" />
    <path d="M 64 67 C 45 67 45 52 55 42 C 60 52 65 57 64 67 Z" fill="url(#roseLight)" />
    <path d="M 64 67 C 83 67 83 52 73 42 C 68 52 63 57 64 67 Z" fill="url(#roseLight)" />

    <!-- 4. 内层花苞 -->
    <path d="M 64 57 C 52 57 50 37 64 24 C 78 37 76 57 64 57 Z" fill="url(#roseLight)" />
    
    <!-- 内部嵌套的花瓣折痕 -->
    <path d="M 64 24 C 60 32 55 42 64 47 C 73 42 68 32 64 24 Z" fill="url(#roseDark)" stroke="#3D080D" />
    
    <!-- 玫瑰中心的旋涡 -->
    <path d="M 64 37 C 60 37 58 42 64 44 C 70 42 68 37 64 37 Z" fill="#5C000A" stroke="#3D080D" stroke-width="1.5" />
  </g>
</svg>