name: Deploy to Cloud Server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute SSH commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}     # 你的服务器公网 IP
          username: ${{ secrets.SERVER_USER }} # 登录名，通常是 root
          password: ${{ secrets.SERVER_PASS }} # 你的服务器密码
          port: 8848
          script: |
            # 1. 进入你存放代码的目录（如果你没克隆过，这里需要先 clone）
            cd /root/xhj || git clone git@github.com:xhj-hushan/xhj.git
            
            # 2. 拉取最新代码
            git pull origin main
            
            # 3. 重新构建 Docker 镜像
            docker build -t xhj-homepage .
          
            docker stop xhj-web || true
            docker rm xhj-web || true
            docker run -d --name xhj-web -p 8888:80 xhj-homepage
